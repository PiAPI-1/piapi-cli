name: Release staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piapi-cli-v0.4.0-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.4.0
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          test "$(git rev-parse HEAD)" = "6424c01c140d16453a22696b499c52f894b903ce"
          node -e 'const p = require("./package.json"); if (p.name !== "piapi-cli" || p.version !== "0.4.0") throw new Error("Unexpected release package");'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install staging-capable npm
        run: npm install --global npm@11.19.0 --ignore-scripts

      - name: Validate and pack exact release artifact
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run lint
          bun test
          bun run build
          test "$(node dist/piapi.mjs --version)" = "piapi 0.4.0"
          PIAPI_TEST_BUILT=1 bun test test/commands/image-lifecycle.test.ts
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("node:fs");
            const [pack] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"));
            const paths = pack.files.map(file => file.path).sort();
            const expected = ["LICENSE", "README.md", "dist/piapi.mjs", "package.json"].sort();
            if (pack.shasum !== "5feccd293700dd2bb0771c33572ef2fb3fde0eee" || JSON.stringify(paths) !== JSON.stringify(expected)) {
              throw new Error("Release artifact does not match the verified package");
            }
          '

      - name: Stage verified tarball without direct publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm stage publish "$RUNNER_TEMP/piapi-cli-0.4.0.tgz" --ignore-scripts --access public --tag latest --json > "$RUNNER_TEMP/stage-result.json"
          cat "$RUNNER_TEMP/stage-result.json"
          npm stage list piapi-cli --json > "$RUNNER_TEMP/stage-list.json"
          cat "$RUNNER_TEMP/stage-list.json"
          {
            printf '## piapi-cli 0.4.0 staged, not publicly released\n\n'
            printf 'Review the Staged Packages tab on npm and approve with maintainer 2FA.\n'
            printf 'Expected tarball SHA-1: `5feccd293700dd2bb0771c33572ef2fb3fde0eee`.\n\n'
            printf 'Do not create a GitHub Release until registry publication and installation are verified.\n\n'
            printf '```json\n'
            cat "$RUNNER_TEMP/stage-list.json"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
